[Debug]
; logging verbosity level (trace, debug, info, warning, error, critical, off)
sLogLevel = info

[Compat]
; redirect Poached Bugs VR's (0.6.0) own TESForm::GetWeight implementation into the real engine one
; so our ammo and lockpick weight hook properly apply to its inventory weight calculations.
; this is a temporary setting that will be gone once Poached Bugs VR fixes its GetWeight calls
; you can disable this if it causes problems but then you won't get ammo accounted for inventory weight
; calculation, unless you also disable Poached Bugs VR's armorWeightModPerkEntry patch
bPoachedBugsVR060GetWeightRedirect = true
